[paths]
train = "data/processed/train.spacy"
dev = "data/processed/dev.spacy"

[model]
name = "en_core_web_sm"
pipeline = ["textcat"]

[training]
batch_size = 8
epochs = 10
dropout = 0.1
learning_rate = 0.001

[textcat]
architecture = "simple_cnn"
num_labels = 3

[logging]
level = "INFO"
log_file = "logs/training.log"